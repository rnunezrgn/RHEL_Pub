---
- name: Manage Ansible Project based on GitHub branch webhook
  hosts: localhost
  gather_facts: true
  vars:
    scm_url: "https://github.com/your-org/your-repo.git"
    organization_id: 1
    controller_host: "https://your-aap.example.com"
    api_user: "your_username"
    api_pass: "your_password"
    my_branch: ""

  tasks:
    - name: Show AAP Variables
      ansible.builtin.debug:
        var: hostvars[inventory_host]

    - name: This playbook expects to receive a GitHub webhook payload as awx_webhook_payload variable
      ansible.builtin.debug:
        msg: "This is the GitHub payload variable: {{ awx_webhook_payload.ref }}"

    - name: Set branch name from webhook or default to my_branch
      ansible.builtin.set_fact:
        branch_name: "{{ awx_webhook_payload.ref | default(my_branch) }}"
        project_name: "Project-{{ awx_webhook_payload.ref | default(my_branch) }}"

    - name: Fail if no branch name was set
      fail:
        msg: "No branch name provided. Run via webhook or pass -e my_branch=branch_name"
      when: branch_name == ""

    - name: Fail early if not a branch creation event (only if webhook was used)
      fail:
        msg: "Not a branch creation event"
      when:
        - awx_webhook_payload is defined
        - awx_webhook_payload.ref_type is defined
        - awx_webhook_payload.ref_type != "branch"

    - name: Sanitize branch name (strip 'refs/heads/')
      ansible.builtin.set_fact:
        branch_name: "{{ awx_webhook_payload.ref | regex_replace('^refs/heads/', '') }}"

    - name: Sanitize branch name (strip 'refs/heads/')
      ansible.builtin.set_fact:
        project_name: "Project-{{ branch_name }}"

    - name: Check if project with this branch already exists
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/controller/v2/projects/?name={{ project_name }}"
        method: GET
        user: "{{ api_user }}"
        password: "{{ api_pass }}"
        force_basic_auth: true
        validate_certs: false
        return_content: yes
      register: existing_project

    - name: Set project_exists flag
      ansible.builtin.set_fact:
        project_exists: "{{ existing_project.json.count > 0 }}"

    - name: Update project if it already exists (change scm_branch)
      when: project_exists
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/controller/v2/projects/{{ existing_project.json.results[0].id }}/"
        method: PATCH
        user: "{{ api_user }}"
        password: "{{ api_pass }}"
        force_basic_auth: true
        body_format: json
        body:
          scm_branch: "{{ branch_name }}"
        validate_certs: false
      register: update_result

    - name: Create new project if it does not exist
      when: not project_exists
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/controller/v2/projects/"
        method: POST
        user: "{{ api_user }}"
        password: "{{ api_pass }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "{{ project_name }}"
          description: "Auto-created project for branch {{ branch_name }}"
          organization: "{{ organization_id }}"
          scm_type: "git"
          scm_url: "{{ scm_url }}"
          scm_branch: "{{ branch_name }}"
          scm_update_on_launch: true
        validate_certs: false
        status_code: [200, 201]  #  This line tells Ansible what error codes to accept
      register: create_result

    - name: Trigger project sync (whether updated or created)
      ansible.builtin.uri:
        url: >-
          {{ controller_host }}/api/controller/v2/projects/{{
            (project_exists | ternary(update_result.json.id, create_result.json.id))
          }}/update/
        method: POST
        user: "{{ api_user }}"
        password: "{{ api_pass }}"
        force_basic_auth: true
        status_code: 202
        validate_certs: false
      register: sync_trigger

    - name: Report status
      ansible.builtin.debug:
        msg: >-
          {{
            'Updated existing project and triggered sync.' if project_exists else
            'Created new project and triggered sync.'
          }}
...

---
- name: Extract testing_proj1 from GitHub PR payload
  hosts: localhost
  gather_facts: no

  vars:
    payload_file: "/mnt/data/output.json"

  tasks:
    - name: Load GitHub PR payload
      slurp:
        src: "{{ payload_file }}"
      register: raw_payload

    - name: Decode JSON
      set_fact:
        github_payload: "{{ raw_payload['content'] | b64decode | from_json }}"

    # ✅ Easy way (direct JSON access)
    - name: Get PR branch (easy way)
      set_fact:
        pr_branch_json: "{{ github_payload.msg | from_yaml | json_query('head.ref') }}"

    - name: Show PR branch from JSON
      debug:
        msg: "Branch (json way): {{ pr_branch_json }}"

    # ✅ Regex way (string scan)
    - name: Extract PR branch using regex
      set_fact:
        pr_branch_regex: "{{ github_payload.msg | regex_search('\"ref\":\\s*\"([^\"]+)\"', '\\1') }}"

    - name: Show PR branch from regex
      debug:
        msg: "Branch (regex way): {{ pr_branch_regex }}"
